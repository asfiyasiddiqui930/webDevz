<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSS Positioning</title>
    <style>
        * {
            margin: 0;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;

            background-image: url("WhatsApp Image 2026-10-14 at 10.41.37 copy.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            border: 2px solid #333;
        }

        .pos-item {
            position: absolute;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
        }

        .top-left {
            top: 10px;
            left: 10px;
        }

        .top-right {
            top: 10px;
            right: 10px;
        }

        .top-center {
            top: 20px;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .center-left {
            top: 50%;
            left: 10px;
        }

        .center-right {
            top: 50%;
            right: 10px;
            bottom: 50%;
        }

        .center {
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
        }


        .bottom-left {
            bottom: 10px;
            left: 10px;
        }

        .bottom-center {
            bottom: 10px;
            left: 41.5%;
        }

        .bottom-right {
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="pos-item top-left">Asfiya Siddiqui</div>
        <div class="pos-item top-right">Asfiya Siddiqui</div>
        <div class="pos-item center">Asfiya Siddiqui</div>
        <div class="pos-item bottom-left">Asfiya Siddiqui</div>
        <div class="pos-item bottom-right">Asfiya Siddiqui</div>
        <div class="pos-item top-center">Asfiya Siddiqui</div>
        <div class="pos-item center-left">Asfiya Siddiqui</div>
        <div class="pos-item center-right">Asfiya Siddiqui</div>
        <div class="pos-item bottom-center">Asfiya Siddiqui</div>

    </div>

</body>

</html>
