<!DOCTYPE html>
<html>

<head>
    <style>
        .tree-right {
            position: absolute;
            left: 0px;
            top: 0px;
            z-index: -1;
        }
        .tree-left{
            position:absolute;
            right:0px;
            top:10px;
            z-index:-1;
        }
    </style>
</head>
<body>
    <h1>This is a heading</h1>
    <img class="tree-right" src="tree image.png">
    <img class="tree-left" src="tree image.png">
    <p>Because the image has a z-index of -1, it will be placed behind the text.</p>
</body>
</html>
