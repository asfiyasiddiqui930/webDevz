<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Sign Up</h2>
    <p>Please fill in this form to create an account.</p>

    <hr>
    <form action="/action_page.php">
        <label for="fname">Email</label>
        <input type="text" id="email" name="email" value="Enter Your Email"><br><br>
        <label for="lname">Password</label>
        <input type="text" id="password" name="password" value="Enter Your Password"><br><br>
        <label for="lname">Repeat Password</label>
        <input type="text" id="repeat_password" name="repeat_password" value="Repeat Your Password"><br><br>
        <input type="checkbox" id="terms" name="terms" value="terms">
        <label for="terms"> Remember me</label><br><br>

        <label for="gender">Gender</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male"> Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female"> Female</label><br>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other"> Other</label><br>

        <p>By creating an account you agree to our <a href="#">Terms & Privacy Policy</a>.</p>
        <input type="submit" value="Sign Up">
        <input type="submit" value="Cancel">
        <hr>
    </form>
</body>
</html>
